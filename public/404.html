<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found | Pelagos Global</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0b3a5c" />
    <link rel="icon" href="/pelagos/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        --c-bg: #f6f8fa; --c-surface: #ffffff; --c-text: #0f2133; --c-muted: #52657a; --c-border: #d8e1e8;
        --c-primary: #0b3a5c; --c-primary-contrast: #ffffff; --c-accent: #0e8a8f; --c-highlight: #d99a2b;
        --grad-ocean: linear-gradient(135deg, #0b3a5c 0%, #0e6b80 55%, #0e8a8f 100%);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --c-bg: #08131e; --c-surface: #0e1e2d; --c-text: #e6eef5; --c-muted: #9db0c2; --c-border: #1f3a52;
          --c-primary: #5cc4d8; --c-primary-contrast: #06121c; --c-accent: #3fc1bb; --c-highlight: #f0b85a;
          --grad-ocean: linear-gradient(135deg, #0a2a44 0%, #0b4a5c 55%, #0d6466 100%);
        }
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0; display: grid; place-items: center; padding: 24px 16px;
        background: var(--c-bg); color: var(--c-text);
        font: 400 1.0625rem/1.65 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .nf { width: 100%; max-width: 560px; text-align: center; }
      .nf-badge {
        width: 120px; height: 120px; margin: 0 auto 28px; border-radius: 28px; background: var(--grad-ocean);
        display: grid; place-items: center; box-shadow: 0 18px 50px rgba(15, 33, 51, 0.16);
      }
      .nf-badge svg { width: 84px; height: 84px; }
      .nf-code { font: 600 0.78rem/1 Inter, system-ui, sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: var(--c-accent); }
      h1 { font-family: Fraunces, Georgia, 'Times New Roman', serif; font-weight: 600; font-size: clamp(1.9rem, 6vw, 2.7rem); line-height: 1.15; margin: 12px 0; }
      p { color: var(--c-muted); margin: 0 0 28px; }
      .nf-btn {
        display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 12px 24px; border-radius: 999px;
        background: var(--c-primary); color: var(--c-primary-contrast); font-weight: 600; text-decoration: none;
      }
      .nf-btn:hover { background: var(--c-accent); color: #fff; }
      .nf-btn:focus-visible { outline: 3px solid var(--c-highlight); outline-offset: 3px; }
      @media (prefers-reduced-motion: no-preference) {
        .nf-wave { animation: nf-bob 3.2s ease-in-out infinite; transform-origin: center; }
        @keyframes nf-bob { 50% { transform: translateY(-3px); } }
      }
    </style>
  </head>
  <body>
    <main class="nf">
      <div class="nf-badge" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="32" cy="26" r="14" stroke="#fff" stroke-opacity=".45" stroke-width="2" />
          <path d="M32 12v28M18 26h28M24 16l16 20M40 16 24 36" stroke="#fff" stroke-opacity=".3" stroke-width="1.6" />
          <circle cx="32" cy="26" r="3" fill="#d99a2b" />
          <path class="nf-wave" d="M8 50c4-3 8-3 12 0s8 3 12 0 8-3 12 0 8 3 12 0" stroke="#d99a2b" stroke-width="3" />
        </svg>
      </div>
      <span class="nf-code">Error 404</span>
      <h1>This page has drifted off course</h1>
      <p>The page you were looking for could not be found. It may have moved, or the link may be out of date.</p>
      <a class="nf-btn" href="/pelagos/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
        Back to Pelagos Global
      </a>
    </main>
  </body>
</html>
